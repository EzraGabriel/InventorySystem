 {id:4,name:'LED Video Light 60W',brand:'Godox · SL-60W',category:'Lighting',year:2021,stock:0,location:'Gudang B · Lemari 4',use:'Lampu continuous untuk pencahayaan studio.',image:photo('photo-1519608487953-e999c86e7455')},
 {id:5,name:'Kabel HDMI 10m',brand:'Ugreen · HDMI 2.0',category:'Kabel',year:2024,stock:8,location:'Gudang A · Kotak Kabel · B2',use:'Menghubungkan kamera ke monitor atau perangkat perekam.',image:photo('photo-1558618666-fcd25c85cd64')},

];
const navItems=[['dashboard','Beranda','home'],['inventory','Inventaris','box'],['mutations','Mutasi','history']];
let state={items:[],mutations:[],page:'dashboard',selectedId:null,query:'',category:'Semua kategori',location:'Semua lokasi',returnFocus:null};
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
state.items=read('ruangstok_items',seedItems);state.mutations=read('ruangstok_mutations',[]);
const save=()=>{localStorage.setItem('ruangstok_items',JSON.stringify(state.items));localStorage.setItem('ruangstok_mutations',JSON.stringify(state.mutations))};
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=(d=new Date())=>new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric'}).format(d);
document.querySelector('#dateLabel').textContent=formatDate();
function drawNav(){for(const id of ['sideNav','bottomNav']){document.getElementById(id).innerHTML=navItems.map(([key,label,ico])=>`<button type="button" data-page="${key}" class="${state.page===key?'active':''}" ${state.page===key?'aria-current="page"':''}>${icons[ico]}<span>${label}</span></button>`).join('')}}
function setPage(page){state.page=page;state.selectedId=null;render()}
function button(label,ico,cls,attrs=''){return `<button type="button" class="button ${cls}" ${attrs}>${ico?icons[ico]:''}${label}</button>`}
function pageHead(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="page-description">${desc}</p></div>${action}</div>`}
function itemById(id){return state.items.find(i=>i.id===Number(id))}
function mutationsSorted(){return [...state.mutations].sort((a,b)=>new Date(b.date)-new Date(a.date))}
function activityRows(limit=8){const rows=mutationsSorted().slice(0,limit);if(!rows.length)return `<div class="empty-state"><strong>Belum ada aktivitas</strong><p>Mutasi stok akan muncul di sini setelah dicatat.</p></div>`;return `<div class="activity-list">${rows.map(m=>`<div class="activity"><div class="activity-icon ${m.type==='masuk'?'in':'out'}" aria-hidden="true">${m.type==='masuk'?'+':'−'}</div><div class="activity-main"><div class="activity-title">${esc(m.type==='masuk'?'Barang masuk':'Barang keluar')} · ${esc(m.itemName)}</div><div class="activity-detail">${m.type==='masuk'?'Ditambahkan':'Dikeluarkan'} ${m.quantity} unit${m.note?' · '+esc(m.note):''}</div></div><time class="activity-time" datetime="${esc(m.date)}">${new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(m.date))}</time></div>`).join('')}</div>`}
function stockStatus(n){return n===0?'<span class="stock-pill out">Stok habis</span>':n<=2?'<span class="stock-pill low">Stok menipis</span>':''}
function dashboard(){let total=state.items.reduce((n,i)=>n+i.stock,0),low=state.items.filter(i=>i.stock<=2),cats=new Set(state.items.map(i=>i.category)).size;return `${pageHead('Ringkasan','Selamat pagi, Andi','Pantau inventaris dan aktivitas alat multimedia hari ini.',button('Tambah barang','plus','button-primary','data-action="add-item"'))}<section class="stats" aria-label="Ringkasan inventaris"><article class="stat-card"><div class="stat-top">Total unit barang <span class="stat-icon green">${icons.box}</span></div><div class="stat-value">${total.toLocaleString('id-ID')}</div><div class="stat-note">Tersebar di ${state.items.length} jenis barang</div></article><article class="stat-card"><div class="stat-top">Jenis barang <span class="stat-icon">${icons.camera}</span></div><div class="stat-value">${state.items.length}</div><div class="stat-note">Dalam ${cats} kategori</div></article><article class="stat-card"><div class="stat-top">Stok menipis <span class="stat-icon amber">${icons.box}</span></div><div class="stat-value">${low.length}</div><div class="stat-note">Barang dengan stok 2 unit atau kurang</div></article><article class="stat-card"><div class="stat-top">Stok habis <span class="stat-icon" style="background:var(--red-soft);color:var(--red)">${icons.box}</span></div><div class="stat-value">${state.items.filter(i=>i.stock===0).length}</div><div class="stat-note">Perlu ditindaklanjuti</div></article></section><section class="dashboard-grid"><article class="panel"><div class="panel-head"><div><h2>Aktivitas terbaru</h2><div class="panel-sub">Catatan barang masuk dan keluar</div></div><button class="text-link" data-page="mutations">Lihat semua ${icons.arrow}</button></div>${activityRows(5)}</article><article class="panel"><div class="panel-head"><div><h2>Perlu perhatian</h2><div class="panel-sub">Stok barang menipis atau habis</div></div><span class="stock-pill ${low.some(i=>!i.stock)?'out':'low'}">${low.length} barang</span></div>${low.length?`<div class="low-list">${low.slice(0,4).map(i=>`<div class="low-item"><img class="thumb" src="${esc(i.image)}" alt=""/><div class="low-info"><div class="low-name">${esc(i.name)}</div><div class="low-meta">${esc(i.location.split(' · ')[0])}</div></div><span class="stock-pill ${i.stock?'low':'out'}">${i.stock?i.stock+' unit':'Habis'}</span></div>`).join('')}</div>`:'<div class="empty-state"><strong>Semua stok aman</strong><p>Tidak ada barang yang perlu diperiksa.</p></div>'}</article></section>`}
function filters(){let cats=['Semua kategori',...new Set(state.items.map(i=>i.category))],locs=['Semua lokasi',...new Set(state.items.map(i=>i.location.split(' · ')[0]))];return `<div class="inventory-toolbar"><label class="search-box">${icons.search}<input id="searchInput" type="search" name="search" aria-label="Cari nama atau merek barang" placeholder="Cari nama barang atau merek…" value="${esc(state.query)}" /></label><select class="select" id="categoryFilter" aria-label="Filter kategori">${cats.map(c=>`<option ${c===state.category?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="select" id="locationFilter" aria-label="Filter lokasi">${locs.map(c=>`<option ${c===state.location?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="results-count" id="resultCount"></span></div>`}
function visibleItems(){return state.items.filter(i=>(`${i.name} ${i.brand}`.toLowerCase().includes(state.query.toLowerCase()))&&(state.category==='Semua kategori'||i.category===state.category)&&(state.location==='Semua lokasi'||i.location.startsWith(state.location)))}
function itemCards(){const items=visibleItems();return `<div class="inventory-grid" id="inventoryGrid">${items.map(i=>`<article class="item-card"><img class="item-photo" src="${esc(i.image)}" alt="Foto ${esc(i.name)}" loading="lazy"/><div class="item-card-body"><div class="item-card-top"><div><div class="item-name">${esc(i.name)}</div><div class="item-brand">${esc(i.brand)}</div></div>${stockStatus(i.stock)}</div><div class="item-meta"><div class="item-location">${icons.pin}<span>${esc(i.location)}</span></div><div class="item-stock"><strong>${i.stock}</strong> unit</div></div><button type="button" class="button button-secondary card-open" data-detail="${i.id}">Lihat detail ${icons.arrow}</button></div></article>`).join('')||`<div class="empty-state" style="grid-column:1/-1"><strong>Tidak ada barang yang cocok</strong><p>Ubah kata kunci atau filter untuk melihat barang lain.</p><button class="button button-secondary" data-action="clear-filters">Hapus filter</button></div>`}</div>`}
function inventory(){return `${pageHead('Katalog','Inventaris','Cari alat, periksa jumlah stok, dan temukan lokasi penyimpanannya.',button('Tambah barang','plus','button-primary','data-action="add-item"'))}<section aria-label="Daftar inventaris">${filters()}${itemCards()}</section>`}
function mutationTable(){const rows=mutationsSorted();return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Barang</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th><th>Dicatat</th></tr></thead><tbody>${rows.map(m=>`<tr><td><div class="table-item"><img src="${esc(m.image||'')}" alt=""/>${esc(m.itemName)}</div></td><td><span class="stock-pill ${m.type==='masuk'?'low':'out'}">${m.type==='masuk'?'Masuk':'Keluar'}</span></td><td>${m.type==='masuk'?'+':'−'}${m.quantity} unit</td><td>${esc(m.note||'—')}</td><td><time datetime="${esc(m.date)}">${new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(m.date))}</time></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty-state"><strong>Belum ada catatan mutasi</strong><p>Catat barang masuk atau keluar dari detail barang.</p></div></td></tr>'}</tbody></table></div>`}
function mutations(){return `${pageHead('Riwayat','Mutasi barang','Lacak setiap perubahan jumlah stok inventaris.') }<section class="panel"><div class="panel-head"><div><h2>Semua aktivitas</h2><div class="panel-sub">${state.mutations.length} catatan tersimpan</div></div><button type="button" class="button button-secondary" data-page="inventory">${icons.box} Buka inventaris</button></div>${mutationTable()}</section>`}
function detail(){const i=itemById(state.selectedId);if(!i){state.page='inventory';return inventory()}return `<button class="back-button" data-page="inventory">${icons.back} Kembali ke inventaris</button><div class="detail-layout" style="margin-top:14px"><div><img class="detail-image" src="${esc(i.image)}" alt="Foto ${esc(i.name)}"/></div><section class="panel"><span class="category-pill">${esc(i.category)}</span><h1 class="detail-title">${esc(i.name)}</h1><div class="detail-brand">${esc(i.brand)}</div><p class="detail-description">${esc(i.use)}</p><div class="detail-data"><div class="detail-cell"><div class="detail-label">Tahun</div><div class="detail-value">${i.year}</div></div><div class="detail-cell"><div class="detail-label">Kategori</div><div class="detail-value">${esc(i.category)}</div></div><div class="detail-cell" style="grid-column:1/-1"><div class="detail-label">Lokasi penyimpanan</div><div class="detail-value">${icons.pin} ${esc(i.location)}</div></div></div><div class="detail-stock"><div><div class="detail-label">Stok tersedia</div>${i.stock<=2?`<div style="margin-top:6px">${stockStatus(i.stock)}</div>`:''}</div><strong>${i.stock} <span style="font-size:12px;font-weight:550;letter-spacing:0">unit</span></strong></div><div class="detail-actions">${button('Barang masuk','plus','button-primary','data-action="open-mutation" data-type="masuk"')}${button('Barang keluar','history','button-soft-danger','data-action="open-mutation" data-type="keluar" '+(i.stock===0?'disabled':''))}</div></section></div>`}
function render(){drawNav();document.getElementById('crumbLabel').textContent=state.selectedId?'Detail barang':({dashboard:'Beranda',inventory:'Inventaris',mutations:'Mutasi'}[state.page]);const main=document.getElementById('main');main.innerHTML=state.selectedId?detail():state.page==='dashboard'?dashboard():state.page==='inventory'?inventory():mutations();if(state.page==='inventory'&&!state.selectedId){const count=document.getElementById('resultCount');if(count)count.textContent=`${visibleItems().length} barang`}}
function showToast(message){const root=document.getElementById('toastRegion');root.innerHTML=`<div class="toast">${icons.check}<span>${esc(message)}</span></div>`;setTimeout(()=>{root.innerHTML=''},3000)}
function openModal(title,desc,content,submitLabel,submitAction){state.returnFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDescription" tabindex="-1"><div class="modal-head"><div><h2 class="modal-title" id="modalTitle">${title}</h2><p class="modal-description" id="modalDescription">${desc}</p></div><button type="button" class="close-button" data-action="close-modal" aria-label="Tutup dialog">×</button></div><form id="activeForm" novalidate>${content}<div id="formMessage" role="alert"></div><footer class="modal-footer"><button type="button" class="button button-secondary" data-action="close-modal">Batal</button><button type="submit" class="button button-primary">${submitLabel}</button></footer></form></section></div>`;document.querySelectorAll('.sidebar,.topbar,.main,.mobile-header,.bottom-nav').forEach(el=>el.inert=true);document.getElementById('overlay').querySelector('.close-button').focus()}
function closeModal(){document.getElementById('overlay').innerHTML='';document.querySelectorAll('.sidebar,.topbar,.main,.mobile-header,.bottom-nav').forEach(el=>el.inert=false);state.returnFocus?.focus?.()}
function addItemModal(){const cats=['Kamera','Lensa','Audio','Lighting','Kabel','Aksesori'];openModal('Tambah barang','Lengkapi informasi alat untuk menambahkannya ke inventaris.',`<div class="form-grid"><div class="field full"><label for="fName">Nama alat *</label><input id="fName" name="name" required placeholder="Contoh: Kamera Mirrorless A7 III"/></div><div class="field"><label for="fBrand">Merek & tipe *</label><input id="fBrand" name="brand" required placeholder="Contoh: Sony · A7 III"/></div><div class="field"><label for="fCategory">Kategori *</label><select id="fCategory" name="category" required>${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label for="fYear">Tahun</label><input id="fYear" name="year" type="number" inputmode="numeric" min="1980" max="${new Date().getFullYear()}" value="${new Date().getFullYear()}"/></div><div class="field"><label for="fStock">Jumlah stok *</label><input id="fStock" name="stock" type="number" inputmode="numeric" min="0" value="1" required/></div><div class="field full"><label for="fLocation">Lokasi penyimpanan *</label><input id="fLocation" name="location" required placeholder="Gudang A · Lemari 2 · Rak B"/></div><div class="field full"><label for="fUse">Kegunaan</label><textarea id="fUse" name="use" placeholder="Jelaskan fungsi alat"></textarea></div><div class="field full"><label for="fImage">URL foto <span style="font-weight:400;color:var(--muted)">(opsional)</span></label><input id="fImage" name="image" type="url" placeholder="https://contoh.com/foto.jpg"/></div></div>`,'Simpan barang',handleAddItem);document.getElementById('fName').focus()}
function openMutation(type){const i=itemById(state.selectedId);if(!i)return;openModal(type==='masuk'?'Catat barang masuk':'Catat barang keluar',`Stok tersedia ${i.stock} unit · ${i.name}`,`<input type="hidden" name="type" value="${type}"/><fieldset style="border:0;padding:0;margin:0 0 16px"><legend class="fieldset-label" style="margin-bottom:8px">Jenis mutasi</legend><div class="radio-group"><div class="radio-card"><input type="radio" id="typeIn" name="typeRadio" value="masuk" ${type==='masuk'?'checked':''}/><label for="typeIn">${icons.plus} Barang masuk</label></div><div class="radio-card"><input type="radio" id="typeOut" name="typeRadio" value="keluar" ${type==='keluar'?'checked':''} ${i.stock===0?'disabled':''}/><label for="typeOut">${icons.history} Barang keluar</label></div></div></fieldset><div class="field" style="margin-bottom:15px"><label for="fQuantity">Jumlah unit *</label><div class="quantity-control"><button type="button" data-action="quantity" data-delta="-1" aria-label="Kurangi jumlah">−</button><input id="fQuantity" name="quantity" type="number" inputmode="numeric" min="1" max="${type==='keluar'?i.stock:99999}" value="1" required/><button type="button" data-action="quantity" data-delta="1" aria-label="Tambah jumlah">+</button></div><div class="field-hint">${type==='keluar'?`Maksimal ${i.stock} unit dapat dikeluarkan.`:'Jumlah akan ditambahkan ke stok saat ini.'}</div></div><div class="field"><label for="fNote">Keterangan <span style="font-weight:400;color:var(--muted)">(opsional)</span></label><textarea id="fNote" name="note" placeholder="Contoh: Dipinjam untuk syuting"></textarea></div>`,'Simpan mutasi',handleMutation);document.querySelectorAll('[name="typeRadio"]').forEach(r=>r.addEventListener('change',e=>{document.querySelector('[name="type"]').value=e.target.value;const q=document.getElementById('fQuantity');q.max=e.target.value==='keluar'?i.stock:99999;document.querySelector('.field-hint').textContent=e.target.value==='keluar'?`Maksimal ${i.stock} unit dapat dikeluarkan.`:'Jumlah akan ditambahkan ke stok saat ini.'}))}
function formData(){return Object.fromEntries(new FormData(document.getElementById('activeForm')).entries())}
function handleAddItem(e){e.preventDefault();const d=formData(),msg=document.getElementById('formMessage'),name=d.name.trim(),brand=d.brand.trim(),location=d.location.trim(),stock=Number(d.stock),year=Number(d.year);if(!name||!brand||!location||!Number.isInteger(stock)||stock<0){msg.innerHTML='<p class="form-error">Isi nama, merek, lokasi, dan jumlah stok dengan benar.</p>';return}if(year<1980||year>new Date().getFullYear()){msg.innerHTML='<p class="form-error">Masukkan tahun yang valid.</p>';return}const item={id:Date.now(),name,brand,category:d.category,year,stock,location,use:d.use.trim()||'Belum ada keterangan kegunaan.',image:d.image||photo('photo-1516035069371-29a1b244cc32')};state.items.unshift(item);save();closeModal();state.page='inventory';state.query='';state.category='Semua kategori';state.location='Semua lokasi';render();showToast('Barang ditambahkan ke inventaris')}
function handleMutation(e){e.preventDefault();const d=formData(),type=d.type,quantity=Number(d.quantity),i=itemById(state.selectedId),msg=document.getElementById('formMessage');if(!i||!Number.isInteger(quantity)||quantity<1){msg.innerHTML='<p class="form-error">Masukkan jumlah unit minimal 1.</p>';return}if(type==='keluar'&&quantity>i.stock){msg.innerHTML=`<p class="form-error">Stok tersedia ${i.stock} unit. Kurangi jumlah barang keluar.</p>`;return}i.stock+=type==='masuk'?quantity:-quantity;state.mutations.unshift({id:Date.now(),itemId:i.id,itemName:i.name,image:i.image,type,quantity,note:d.note.trim(),date:new Date().toISOString()});save();closeModal();render();showToast(type==='masuk'?'Barang masuk berhasil dicatat':'Barang keluar berhasil dicatat')}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){setPage(page.dataset.page);return}const detail=e.target.closest('[data-detail]');if(detail){state.selectedId=Number(detail.dataset.detail);render();return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='add-item')addItemModal();if(a==='close-modal')closeModal();if(a==='open-mutation')openMutation(action.dataset.type);if(a==='clear-filters'){state.query='';state.category='Semua kategori';state.location='Semua lokasi';render()}if(a==='quantity'){const input=document.getElementById('fQuantity'),next=Number(input.value)+Number(action.dataset.delta);if(next>=1&&next<=Number(input.max||99999))input.value=next}return}if(e.target.matches('[data-backdrop]'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='activeForm'){const form=e.target;if(form.querySelector('[name="name"]'))handleAddItem(e);else handleMutation(e)}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){state.query=e.target.value;const grid=document.getElementById('inventoryGrid');if(grid)grid.outerHTML=itemCards();const count=document.getElementById('resultCount');if(count)count.textContent=`${visibleItems().length} barang`}});
document.addEventListener('change',e=>{if(e.target.id==='categoryFilter'||e.target.id==='locationFilter'){state.category=document.getElementById('categoryFilter').value;state.location=document.getElementById('locationFilter').value;const old=document.getElementById('inventoryGrid');if(old)old.outerHTML=itemCards();const count=document.getElementById('resultCount');if(count)count.textContent=`${visibleItems().length} barang`}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('[role="dialog"]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!document.querySelector('[role="dialog"]'))return;const dialog=document.querySelector('[role="dialog"]'),focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
render();
</script>
